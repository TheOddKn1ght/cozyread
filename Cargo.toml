[package]
name = "cozyread"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A quiet terminal audiobook player for local files"
license = "MIT"

[dependencies]
crossterm = "=0.29.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "mp3", "mp4", "flac", "vorbis", "wav", "symphonia-alac"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
